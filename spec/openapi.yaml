openapi: 3.1.0

info:
  title: IRP Progress Management API
  # Kept in step with the workspace `package.json` files, all of which are
  # 0.0.0. `/health` reports the running application version, so two sources
  # that disagree would put a visible contradiction in the artifact.
  version: 0.0.0
  summary: Daily progress tracking and monthly evaluation for the Bistec Hearts Academy IRP.
  description: |
    Students submit a short text update on each working day. Mentors review those
    submissions, record attendance, and evaluate monthly against a fixed rubric.

    Weekdays are required submission days. Weekends are optional and may hold
    Extra work; a weekend is never counted as missed and never enters a
    compliance denominator.

    All timestamps are UTC. All deadlines and evaluation-cycle boundaries are
    evaluated in Asia/Colombo.
  contact:
    name: Damian De Cruz
    email: johann@bistecglobal.com
  license:
    name: UNLICENSED
    url: https://bistecglobal.com

servers:
  - url: http://localhost:3001
    description: Local development.

tags:
  - name: System
    description: Liveness and diagnostics. Unauthenticated.
  - name: Identity
    description: The authenticated caller.
  - name: Submissions
    description: Student daily entries and their rolled-up day view.

# Fail closed: every operation requires a bearer token unless it explicitly
# opts out with `security: []`. Without this, an operation that simply omits
# the key would inherit "no auth required" — the wrong default for a system
# where only health checks are public.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: |
        Reports that the service is running. Touches no database and requires
        no token, so it is safe to use as a container liveness probe.

        The 400 and 401 responses are unreachable on this operation — it accepts
        no input and requires no credentials — but are documented because the
        contract defines all four for every operation without exception.
      tags: [System]
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                running:
                  summary: A healthy service
                  value:
                    status: ok
                    version: 0.0.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: The authenticated caller
      description: |
        Returns the registered user matching the bearer token's `oid` claim.

        Authentication is not authorisation. A structurally valid, correctly
        signed, unexpired token whose subject has no user record receives 403,
        not an auto-created account — registration is an Admin action and there
        is no self-registration.
      tags: [Identity]
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                student:
                  summary: A student
                  value:
                    id: 3f1a2b4c-5d6e-4f70-8192-a3b4c5d6e7f8
                    email: a.perera@bistecglobal.com
                    displayName: Amaya Perera
                    role: Student
                mentor:
                  summary: A mentor
                  value:
                    id: 9c8b7a6d-5e4f-4a3b-9182-7c6d5e4f3a2b
                    email: d.decruz@bistecglobal.com
                    displayName: Damian De Cruz
                    role: Admin
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/entries:
    post:
      operationId: createEntry
      summary: Submit a daily entry
      description: |
        Creates one text entry for a target date the submission window
        currently allows (FR-15: today or the previous weekday, weekends
        included as optional Extra days — FR-33). The server computes
        `isLate`/`isExtra` at the submission instant and creates the day's
        DailyReport on first entry. Multiple entries per day are allowed.

        Only students submit entries; a mentor token receives 403.
      tags: [Submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      responses:
        '200':
          description: The stored entry, with server-computed flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
              examples:
                onTime:
                  summary: Submitted on the target day
                  value:
                    id: 7be9f1d2-3c44-4f8a-9a01-2b3c4d5e6f70
                    entryDate: '2026-08-03'
                    body: Implemented the roster endpoint and its tests.
                    submittedAt: '2026-08-03T11:30:00.000Z'
                    isLate: false
                    isExtra: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/me/days:
    get:
      operationId: listMyDays
      summary: My rolled-up day history
      description: |
        One element per calendar day in the range, oldest first: the caller's
        entries for that day, the review status of the day's report, and the
        server-computed classification. Weekends appear with status `extra`
        (work recorded) or `none` (nothing) — never late or missed (FR-33).
        Days outside the caller's enrolment intervals also report `none` —
        no enrolment, no obligation — even when such a day is in the future.

        Defaults to the current evaluation cycle (the 10th of the month to
        the 9th of the next, Asia/Colombo) when `from`/`to` are omitted.
      tags: [Submissions]
      parameters:
        - name: from
          in: query
          required: false
          description: First day of the range (inclusive). Defaults to the current cycle's start.
          schema:
            type: string
            format: date
            examples:
              - '2026-07-10'
        - name: to
          in: query
          required: false
          description: Last day of the range (inclusive). Defaults to the current cycle's end. Ranges over 92 days are rejected.
          schema:
            type: string
            format: date
            examples:
              - '2026-08-09'
      responses:
        '200':
          description: The day-by-day view, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DaySummary'
              examples:
                twoDays:
                  summary: A submitted weekday and an untouched weekend day
                  value:
                    - date: '2026-07-31'
                      status: onTime
                      reportStatus: Submitted
                      reportId: 5a3c2b1d-0e9f-4a8b-b7c6-d5e4f3a2b1c0
                      absenceReason: null
                      entries:
                        - id: 7be9f1d2-3c44-4f8a-9a01-2b3c4d5e6f70
                          entryDate: '2026-07-31'
                          body: Wrote the cycle materialisation tests.
                          submittedAt: '2026-07-31T10:05:00.000Z'
                          isLate: false
                          isExtra: false
                    - date: '2026-08-01'
                      status: none
                      reportStatus: null
                      reportId: null
                      absenceReason: null
                      entries: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT issued by Microsoft Entra ID. The token's `oid` claim is matched
        against a registered user. Authentication is not authorisation: a valid
        token whose subject has no user record is rejected with 403, because
        registration is an Admin action.

  schemas:
    Problem:
      type: object
      title: Problem
      description: |
        An error, as RFC 7807 Problem Details, extended with the OpenTelemetry
        trace id of the request that failed.

        `additionalProperties` is deliberately permitted here: RFC 7807 defines
        extension members, and `traceId` is one. The repository rule requiring
        `additionalProperties: false` applies to request bodies, not to this
        response shape.
      required: [type, title, status, traceId]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference identifying the problem type.
          default: about:blank
          examples:
            - https://irp.bistec.example/problems/validation-failed
        title:
          type: string
          description: A short, human-readable summary of the problem type. Stable across occurrences.
          examples:
            - Request validation failed
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code, repeated here for convenience.
          examples:
            - 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
          examples:
            - body must NOT have additional properties
        instance:
          type: string
          format: uri-reference
          description: A URI reference identifying this specific occurrence.
          examples:
            - /api/v1/me
        traceId:
          type: string
          description: |
            The OpenTelemetry trace id of the failing request. Quote this when
            reporting a problem; it maps directly to the trace in Application Insights.
          examples:
            - 4bf92f3577b34da6a3ce929d0e0e4736

    Role:
      type: string
      title: Role
      enum: [Admin, Student]
      description: |
        Admin is a mentor. Every mentor holds an Admin account and there is no
        super-admin tier above it. Admins share access across all batches in v1.
      examples:
        - Student

    User:
      type: object
      title: User
      description: A registered participant in the programme.
      required: [id, email, displayName, role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Stable internal identifier. Not the Entra object id.
          examples:
            - 3f1a2b4c-5d6e-4f70-8192-a3b4c5d6e7f8
        email:
          type: string
          format: email
          description: Bistec account email address. Unique across users.
          examples:
            - a.perera@bistecglobal.com
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: Name as shown in the interface.
          examples:
            - Amaya Perera
        role:
          $ref: '#/components/schemas/Role'

    HealthStatus:
      type: object
      title: HealthStatus
      description: Liveness report.
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok`. A service that cannot report `ok` does not respond at all.
          examples:
            - ok
        version:
          type: string
          description: The running application version.
          examples:
            - 0.0.0

    EntryCreate:
      type: object
      title: EntryCreate
      description: A new daily entry. Text only — attachments are a confirmed non-goal.
      required: [entryDate, body]
      additionalProperties: false
      properties:
        entryDate:
          type: string
          format: date
          description: The civil date (Asia/Colombo) this entry is for. Must be inside the caller's current submission window.
          examples:
            - '2026-08-03'
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: What was worked on. Plain text.
          examples:
            - Implemented the roster endpoint and its tests.

    Entry:
      type: object
      title: Entry
      description: One stored entry with server-computed flags.
      required: [id, entryDate, body, submittedAt, isLate, isExtra]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Entry identifier.
          examples:
            - 7be9f1d2-3c44-4f8a-9a01-2b3c4d5e6f70
        entryDate:
          type: string
          format: date
          description: The civil date the entry targets.
          examples:
            - '2026-08-03'
        body:
          type: string
          description: The submitted text.
          examples:
            - Implemented the roster endpoint and its tests.
        submittedAt:
          type: string
          format: date-time
          description: UTC instant the entry was accepted.
          examples:
            - '2026-08-03T11:30:00.000Z'
        isLate:
          type: boolean
          description: True when a required day's entry arrived after that day ended but inside grace. Weekends are never late.
          examples:
            - false
        isExtra:
          type: boolean
          description: True for entries on optional (weekend) days — FR-33.
          examples:
            - false

    DayStatus:
      type: string
      title: DayStatus
      enum: [onTime, late, absent, missed, pending, extra, none, future]
      description: |
        Server-computed classification of one day.

        A day with no entry that falls outside every one of the student's
        enrolment intervals — before joining, after leaving, or for a caller
        with no enrolment at all — carries no obligation and is always
        `none`, even when that day is in the future.

        Otherwise (an entry was recorded, or the day falls inside an
        enrolment interval): `future` means the day has not arrived yet. Of
        the days that have arrived, required days (weekdays) resolve to
        onTime/late/absent/missed/pending, and optional days (weekends)
        resolve to extra/none — never late or missed. `pending` means the
        grace window is still open. There is no rejected state.
      examples:
        - onTime

    ReportStatus:
      type: string
      title: ReportStatus
      enum: [Submitted, InReview, Evaluated]
      description: Review state of one day's rolled-up report (FR-18/FR-20). Forward-only; Evaluated locks the day.
      examples:
        - Submitted

    DaySummary:
      type: object
      title: DaySummary
      description: Everything on record for one student and one calendar day.
      required: [date, status, reportStatus, reportId, absenceReason, entries]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: The civil date (Asia/Colombo).
          examples:
            - '2026-07-31'
        status:
          $ref: '#/components/schemas/DayStatus'
        reportStatus:
          oneOf:
            - $ref: '#/components/schemas/ReportStatus'
            - type: 'null'
          description: Review state of the day's report, or null when no entry has created one.
        reportId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: The DailyReport id, used by mentors to transition review state. Null until a first entry exists.
          examples:
            - 5a3c2b1d-0e9f-4a8b-b7c6-d5e4f3a2b1c0
        absenceReason:
          oneOf:
            - type: string
            - type: 'null'
          description: The recorded absence reason, when the day is marked absent.
          examples:
            - medical appointment
        entries:
          type: array
          description: The day's entries, earliest first. Empty when nothing was submitted.
          items:
            $ref: '#/components/schemas/Entry'

  responses:
    BadRequest:
      description: The request was malformed or failed schema validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            additionalProperty:
              summary: A request body carried an unexpected property
              value:
                type: https://irp.bistec.example/problems/validation-failed
                title: Request validation failed
                status: 400
                detail: body must NOT have additional properties
                instance: /api/v1/example
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Unauthorized:
      description: No bearer token was supplied, or the token was malformed or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            expiredToken:
              summary: The bearer token had expired
              value:
                type: https://irp.bistec.example/problems/unauthorized
                title: Authentication required
                status: 401
                detail: The bearer token has expired.
                instance: /api/v1/example
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Forbidden:
      description: |
        The token was valid, but its subject is not a registered user.
        Registration is an Admin action; there is no self-registration.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unregistered:
              summary: Authenticated, but no user record exists
              value:
                type: https://irp.bistec.example/problems/not-registered
                title: Not a registered user
                status: 403
                detail: This account has not been registered by an Admin.
                instance: /api/v1/me
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Conflict:
      description: The request is valid but conflicts with the day's current state — locked (Evaluated), marked absent, or already holding contradictory records.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            lockedDay:
              summary: The day is Evaluated and locked
              value:
                type: https://irp.bistec.example/problems/day-locked
                title: Day is locked
                status: 409
                detail: 2026-08-03 is Evaluated and locked for the student (FR-20).
                instance: /api/v1/entries
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    InternalServerError:
      description: An unexpected error. The trace id identifies the failing request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unhandled:
              summary: An unhandled error
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred.
                instance: /api/v1/example
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    ServiceUnavailable:
      description: |
        A dependency required to authenticate the request could not be
        reached — for example, the JWKS endpoint used to verify the bearer
        token's signature. This is distinct from 401: the token itself may be
        perfectly valid, but it could not be checked. Retrying later is
        reasonable; retrying with a different token is not.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            jwksUnreachable:
              summary: The JWKS endpoint could not be reached
              value:
                type: https://irp.bistec.example/problems/service-unavailable
                title: Service temporarily unavailable
                status: 503
                detail: >-
                  Could not retrieve the signing keys needed to verify your
                  session. Please retry.
                instance: /api/v1/me
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
