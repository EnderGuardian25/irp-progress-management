openapi: 3.1.0

info:
  title: IRP Progress Management API
  # Kept in step with the workspace `package.json` files, all of which are
  # 0.0.0. `/health` reports the running application version, so two sources
  # that disagree would put a visible contradiction in the artifact.
  version: 0.0.0
  summary: Daily progress tracking and monthly evaluation for the Bistec Hearts Academy IRP.
  description: |
    Students submit a short text update on each working day. Mentors review those
    submissions, record attendance, and evaluate monthly against a fixed rubric.

    Weekdays are required submission days. Weekends are optional and may hold
    Extra work; a weekend is never counted as missed and never enters a
    compliance denominator.

    All timestamps are UTC. All deadlines and evaluation-cycle boundaries are
    evaluated in Asia/Colombo.
  contact:
    name: Damian De Cruz
    email: johann@bistecglobal.com
  license:
    name: UNLICENSED
    url: https://bistecglobal.com

servers:
  - url: http://localhost:3001
    description: Local development.

tags:
  - name: System
    description: Liveness and diagnostics. Unauthenticated.
  - name: Identity
    description: The authenticated caller.
  - name: Submissions
    description: Student daily entries and their rolled-up day view.
  - name: Absences
    description: Explicitly recorded weekday absences. Recorded, not requested — there is no approval workflow.
  - name: Batches
    description: Cohorts and their enrolment rosters. Mentor (Admin) access only.

# Fail closed: every operation requires a bearer token unless it explicitly
# opts out with `security: []`. Without this, an operation that simply omits
# the key would inherit "no auth required" — the wrong default for a system
# where only health checks are public.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      description: |
        Reports that the service is running. Touches no database and requires
        no token, so it is safe to use as a container liveness probe.

        The 400 and 401 responses are unreachable on this operation — it accepts
        no input and requires no credentials — but are documented because the
        contract defines all four for every operation without exception.
      tags: [System]
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                running:
                  summary: A healthy service
                  value:
                    status: ok
                    version: 0.0.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: The authenticated caller
      description: |
        Returns the registered user matching the bearer token's `oid` claim.

        Authentication is not authorisation. A structurally valid, correctly
        signed, unexpired token whose subject has no user record receives 403,
        not an auto-created account — registration is an Admin action and there
        is no self-registration.
      tags: [Identity]
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                student:
                  summary: A student
                  value:
                    id: 3f1a2b4c-5d6e-4f70-8192-a3b4c5d6e7f8
                    email: a.perera@bistecglobal.com
                    displayName: Amaya Perera
                    role: Student
                mentor:
                  summary: A mentor
                  value:
                    id: 9c8b7a6d-5e4f-4a3b-9182-7c6d5e4f3a2b
                    email: d.decruz@bistecglobal.com
                    displayName: Damian De Cruz
                    role: Admin
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/entries:
    post:
      operationId: createEntry
      summary: Submit a daily entry
      description: |
        Creates one text entry for a target date the submission window
        currently allows (FR-15: today or the previous weekday, weekends
        included as optional Extra days — FR-33). The server computes
        `isLate`/`isExtra` at the submission instant and creates the day's
        DailyReport on first entry. Multiple entries per day are allowed.

        Only students submit entries; a mentor token receives 403.
      tags: [Submissions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryCreate'
      responses:
        '200':
          description: The stored entry, with server-computed flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entry'
              examples:
                onTime:
                  summary: Submitted on the target day
                  value:
                    id: 7be9f1d2-3c44-4f8a-9a01-2b3c4d5e6f70
                    entryDate: '2026-08-03'
                    body: Implemented the roster endpoint and its tests.
                    submittedAt: '2026-08-03T11:30:00.000Z'
                    isLate: false
                    isExtra: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/me/days:
    get:
      operationId: listMyDays
      summary: My rolled-up day history
      description: |
        One element per calendar day in the range, oldest first: the caller's
        entries for that day, the review status of the day's report, and the
        server-computed classification. Weekends appear with status `extra`
        (work recorded) or `none` (nothing) — never late or missed (FR-33).
        Days outside the caller's enrolment intervals also report `none` —
        no enrolment, no obligation — even when such a day is in the future.

        Defaults to the current evaluation cycle (the 10th of the month to
        the 9th of the next, Asia/Colombo) when `from`/`to` are omitted.
      tags: [Submissions]
      parameters:
        - name: from
          in: query
          required: false
          description: First day of the range (inclusive). Defaults to the current cycle's start.
          schema:
            type: string
            format: date
            examples:
              - '2026-07-10'
        - name: to
          in: query
          required: false
          description: Last day of the range (inclusive). Defaults to the current cycle's end. Ranges over 92 days are rejected.
          schema:
            type: string
            format: date
            examples:
              - '2026-08-09'
      responses:
        '200':
          description: The day-by-day view, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DaySummary'
              examples:
                twoDays:
                  summary: A submitted weekday and an untouched weekend day
                  value:
                    - date: '2026-07-31'
                      status: onTime
                      reportStatus: Submitted
                      reportId: 5a3c2b1d-0e9f-4a8b-b7c6-d5e4f3a2b1c0
                      absenceReason: null
                      entries:
                        - id: 7be9f1d2-3c44-4f8a-9a01-2b3c4d5e6f70
                          entryDate: '2026-07-31'
                          body: Wrote the cycle materialisation tests.
                          submittedAt: '2026-07-31T10:05:00.000Z'
                          isLate: false
                          isExtra: false
                    - date: '2026-08-01'
                      status: none
                      reportStatus: null
                      reportId: null
                      absenceReason: null
                      entries: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/absences:
    post:
      operationId: createAbsence
      summary: Mark a weekday absent
      description: |
        Records an absence with a reason (FR-16). Weekdays only — a weekend
        carries no obligation to be absent from (400). The day must still be
        inside its submission window (400 otherwise), must not be locked
        (409), and must not already hold entries (409) — absent and
        submitted are contradictory.
      tags: [Absences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceCreate'
      responses:
        '200':
          description: The recorded absence.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
              examples:
                medical:
                  summary: A recorded absence
                  value:
                    id: 1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9
                    date: '2026-08-03'
                    reason: medical appointment
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/absences/{date}:
    delete:
      operationId: deleteAbsence
      summary: Remove an absence mark
      description: |
        Removes the caller's absence record for the date. Allowed only while
        the day is still inside its submission window and not locked — a
        finalised day is history, not editable state.
      tags: [Absences]
      parameters:
        - name: date
          in: path
          required: true
          description: The civil date whose absence mark to remove.
          schema:
            type: string
            format: date
            examples:
              - '2026-08-03'
      responses:
        '200':
          description: The absence was removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Absence'
              examples:
                removed:
                  summary: The removed record
                  value:
                    id: 1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9
                    date: '2026-08-03'
                    reason: medical appointment
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/batches:
    get:
      operationId: listBatches
      summary: List batches
      description: All cohorts, oldest first. Mentor only.
      tags: [Batches]
      responses:
        '200':
          description: Every batch.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Batch'
              examples:
                two:
                  summary: Two concurrent cohorts
                  value:
                    - id: 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
                      name: Batch Aurora
                      startDate: '2026-05-10'
                      endDate: '2026-11-09'
                    - id: 9e8d7c6b-5a4f-4e3d-8c2b-1a0f9e8d7c6b
                      name: Batch Basalt
                      startDate: '2026-07-10'
                      endDate: '2027-01-09'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      operationId: createBatch
      summary: Create a batch
      description: |
        Creates a cohort (FR-6). startDate must precede endDate. `name` is
        unique; a repeated name is rejected with 409.
      tags: [Batches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreate'
      responses:
        '200':
          description: The created batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              examples:
                created:
                  summary: A new cohort
                  value:
                    id: 7a6b5c4d-3e2f-4a1b-9c8d-7e6f5a4b3c2d
                    name: Batch Cinder
                    startDate: '2026-09-10'
                    endDate: '2027-03-09'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/batches/{id}/roster:
    get:
      operationId: getBatchRoster
      summary: The batch roster for a date
      description: |
        Every student enrolled on the given date (archived students leave
        active rosters), each with their day view, mentor-record presence,
        and the cycle's Extra count. Defaults to today (Asia/Colombo).
      tags: [Batches]
      parameters:
        - name: id
          in: path
          required: true
          description: The batch id.
          schema:
            type: string
            format: uuid
            examples:
              - 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        - name: date
          in: query
          required: false
          description: The roster date. Defaults to today in Asia/Colombo.
          schema:
            type: string
            format: date
            examples:
              - '2026-08-03'
      responses:
        '200':
          description: One row per enrolled student, ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RosterRow'
              examples:
                oneRow:
                  summary: A single enrolled student
                  value:
                    - student:
                        id: 3f1a2b4c-5d6e-4f70-8192-a3b4c5d6e7f8
                        displayName: Amaya Perera
                        email: a.perera@bistecglobal.com
                      day:
                        date: '2026-08-03'
                        status: onTime
                        reportStatus: Submitted
                        reportId: 5a3c2b1d-0e9f-4a8b-b7c6-d5e4f3a2b1c0
                        absenceReason: null
                        entries:
                          - id: 7be9f1d2-3c44-4f8a-9a01-2b3c4d5e6f70
                            entryDate: '2026-08-03'
                            body: Implemented the roster endpoint and its tests.
                            submittedAt: '2026-08-03T11:30:00.000Z'
                            isLate: false
                            isExtra: false
                      hasMentorRecord: false
                      extraCountThisCycle: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A JWT issued by Microsoft Entra ID. The token's `oid` claim is matched
        against a registered user. Authentication is not authorisation: a valid
        token whose subject has no user record is rejected with 403, because
        registration is an Admin action.

  schemas:
    Problem:
      type: object
      title: Problem
      description: |
        An error, as RFC 7807 Problem Details, extended with the OpenTelemetry
        trace id of the request that failed.

        `additionalProperties` is deliberately permitted here: RFC 7807 defines
        extension members, and `traceId` is one. The repository rule requiring
        `additionalProperties: false` applies to request bodies, not to this
        response shape.
      required: [type, title, status, traceId]
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
          description: A URI reference identifying the problem type.
          default: about:blank
          examples:
            - https://irp.bistec.example/problems/validation-failed
        title:
          type: string
          description: A short, human-readable summary of the problem type. Stable across occurrences.
          examples:
            - Request validation failed
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: The HTTP status code, repeated here for convenience.
          examples:
            - 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
          examples:
            - body must NOT have additional properties
        instance:
          type: string
          format: uri-reference
          description: A URI reference identifying this specific occurrence.
          examples:
            - /api/v1/me
        traceId:
          type: string
          description: |
            The OpenTelemetry trace id of the failing request. Quote this when
            reporting a problem; it maps directly to the trace in Application Insights.
          examples:
            - 4bf92f3577b34da6a3ce929d0e0e4736

    Role:
      type: string
      title: Role
      enum: [Admin, Student]
      description: |
        Admin is a mentor. Every mentor holds an Admin account and there is no
        super-admin tier above it. Admins share access across all batches in v1.
      examples:
        - Student

    User:
      type: object
      title: User
      description: A registered participant in the programme.
      required: [id, email, displayName, role]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Stable internal identifier. Not the Entra object id.
          examples:
            - 3f1a2b4c-5d6e-4f70-8192-a3b4c5d6e7f8
        email:
          type: string
          format: email
          description: Bistec account email address. Unique across users.
          examples:
            - a.perera@bistecglobal.com
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: Name as shown in the interface.
          examples:
            - Amaya Perera
        role:
          $ref: '#/components/schemas/Role'

    HealthStatus:
      type: object
      title: HealthStatus
      description: Liveness report.
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
          description: Always `ok`. A service that cannot report `ok` does not respond at all.
          examples:
            - ok
        version:
          type: string
          description: The running application version.
          examples:
            - 0.0.0

    EntryCreate:
      type: object
      title: EntryCreate
      description: A new daily entry. Text only — attachments are a confirmed non-goal.
      required: [entryDate, body]
      additionalProperties: false
      properties:
        entryDate:
          type: string
          format: date
          description: The civil date (Asia/Colombo) this entry is for. Must be inside the caller's current submission window.
          examples:
            - '2026-08-03'
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: What was worked on. Plain text.
          examples:
            - Implemented the roster endpoint and its tests.

    Entry:
      type: object
      title: Entry
      description: One stored entry with server-computed flags.
      required: [id, entryDate, body, submittedAt, isLate, isExtra]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Entry identifier.
          examples:
            - 7be9f1d2-3c44-4f8a-9a01-2b3c4d5e6f70
        entryDate:
          type: string
          format: date
          description: The civil date the entry targets.
          examples:
            - '2026-08-03'
        body:
          type: string
          description: The submitted text.
          examples:
            - Implemented the roster endpoint and its tests.
        submittedAt:
          type: string
          format: date-time
          description: UTC instant the entry was accepted.
          examples:
            - '2026-08-03T11:30:00.000Z'
        isLate:
          type: boolean
          description: True when a required day's entry arrived after that day ended but inside grace. Weekends are never late.
          examples:
            - false
        isExtra:
          type: boolean
          description: True for entries on optional (weekend) days — FR-33.
          examples:
            - false

    DayStatus:
      type: string
      title: DayStatus
      enum: [onTime, late, absent, missed, pending, extra, none, future]
      description: |
        Server-computed classification of one day.

        A day with no entry that falls outside every one of the student's
        enrolment intervals — before joining, after leaving, or for a caller
        with no enrolment at all — carries no obligation and is always
        `none`, even when that day is in the future.

        Otherwise (an entry was recorded, or the day falls inside an
        enrolment interval): `future` means the day has not arrived yet. Of
        the days that have arrived, required days (weekdays) resolve to
        onTime/late/absent/missed/pending, and optional days (weekends)
        resolve to extra/none — never late or missed. `pending` means the
        grace window is still open. There is no rejected state.
      examples:
        - onTime

    ReportStatus:
      type: string
      title: ReportStatus
      enum: [Submitted, InReview, Evaluated]
      description: Review state of one day's rolled-up report (FR-18/FR-20). Forward-only; Evaluated locks the day.
      examples:
        - Submitted

    DaySummary:
      type: object
      title: DaySummary
      description: Everything on record for one student and one calendar day.
      required: [date, status, reportStatus, reportId, absenceReason, entries]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: The civil date (Asia/Colombo).
          examples:
            - '2026-07-31'
        status:
          $ref: '#/components/schemas/DayStatus'
        reportStatus:
          oneOf:
            - $ref: '#/components/schemas/ReportStatus'
            - type: 'null'
          description: Review state of the day's report, or null when no entry has created one.
        reportId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: The DailyReport id, used by mentors to transition review state. Null until a first entry exists.
          examples:
            - 5a3c2b1d-0e9f-4a8b-b7c6-d5e4f3a2b1c0
        absenceReason:
          oneOf:
            - type: string
            - type: 'null'
          description: The recorded absence reason, when the day is marked absent.
          examples:
            - medical appointment
        entries:
          type: array
          description: The day's entries, earliest first. Empty when nothing was submitted.
          items:
            $ref: '#/components/schemas/Entry'

    AbsenceCreate:
      type: object
      title: AbsenceCreate
      description: A new absence mark for a weekday still inside its submission window (FR-16).
      required: [date, reason]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
          description: The weekday to mark absent. Must be inside the caller's current submission window.
          examples:
            - '2026-08-03'
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the student was absent.
          examples:
            - medical appointment

    Absence:
      type: object
      title: Absence
      description: One recorded absence.
      required: [id, date, reason]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Absence record identifier.
          examples:
            - 1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9
        date:
          type: string
          format: date
          description: The civil date marked absent.
          examples:
            - '2026-08-03'
        reason:
          type: string
          description: Why the student was absent.
          examples:
            - medical appointment

    Batch:
      type: object
      title: Batch
      description: A cohort with its own start and end dates. Two run concurrently; calendars are independent.
      required: [id, name, startDate, endDate]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Batch identifier.
          examples:
            - 0b1c2d3e-4f5a-4b6c-8d7e-9f0a1b2c3d4e
        name:
          type: string
          description: Display name.
          examples:
            - Batch Aurora
        startDate:
          type: string
          format: date
          description: Admission date — anchors cycle numbering (FR-6, FR-9).
          examples:
            - '2026-05-10'
        endDate:
          type: string
          format: date
          description: Programme end for this cohort.
          examples:
            - '2026-11-09'

    BatchCreate:
      type: object
      title: BatchCreate
      description: A new cohort. startDate must precede endDate.
      required: [name, startDate, endDate]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Display name. Must be unique; a repeat is rejected with 409.
          examples:
            - Batch Cinder
        startDate:
          type: string
          format: date
          description: Admission date.
          examples:
            - '2026-09-10'
        endDate:
          type: string
          format: date
          description: Programme end. Must be after startDate (400 otherwise).
          examples:
            - '2027-03-09'

    RosterRow:
      type: object
      title: RosterRow
      description: One enrolled student's state for the roster date — the mentor's working view (FR-28 groundwork).
      required: [student, day, hasMentorRecord, extraCountThisCycle]
      additionalProperties: false
      properties:
        student:
          type: object
          description: The enrolled student.
          required: [id, displayName, email]
          additionalProperties: false
          properties:
            id:
              type: string
              format: uuid
              description: User id.
              examples:
                - 3f1a2b4c-5d6e-4f70-8192-a3b4c5d6e7f8
            displayName:
              type: string
              description: Name as shown in the interface.
              examples:
                - Amaya Perera
            email:
              type: string
              format: email
              description: Bistec account email.
              examples:
                - a.perera@bistecglobal.com
        day:
          $ref: '#/components/schemas/DaySummary'
        hasMentorRecord:
          type: boolean
          description: Whether the mentor has recorded attendance/tasks for this date (FR-19).
          examples:
            - true
        extraCountThisCycle:
          type: integer
          minimum: 0
          description: Weekend Extra entries inside the cycle containing the roster date. A count, not a status — Extra is not a compliance state.
          examples:
            - 2

  responses:
    BadRequest:
      description: The request was malformed or failed schema validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            additionalProperty:
              summary: A request body carried an unexpected property
              value:
                type: https://irp.bistec.example/problems/validation-failed
                title: Request validation failed
                status: 400
                detail: body must NOT have additional properties
                instance: /api/v1/example
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Unauthorized:
      description: No bearer token was supplied, or the token was malformed or expired.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            expiredToken:
              summary: The bearer token had expired
              value:
                type: https://irp.bistec.example/problems/unauthorized
                title: Authentication required
                status: 401
                detail: The bearer token has expired.
                instance: /api/v1/example
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Forbidden:
      description: |
        The token was valid, but its subject is not a registered user.
        Registration is an Admin action; there is no self-registration.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unregistered:
              summary: Authenticated, but no user record exists
              value:
                type: https://irp.bistec.example/problems/not-registered
                title: Not a registered user
                status: 403
                detail: This account has not been registered by an Admin.
                instance: /api/v1/me
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    NotFound:
      description: The referenced resource does not exist for this caller.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            missingAbsence:
              summary: No absence recorded on that date
              value:
                type: https://irp.bistec.example/problems/absence-not-found
                title: No absence recorded
                status: 404
                detail: No absence is recorded for 2026-08-03.
                instance: /api/v1/absences/2026-08-03
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    Conflict:
      description: The request is valid but conflicts with the day's current state — locked (Evaluated), marked absent, or already holding contradictory records.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            lockedDay:
              summary: The day is Evaluated and locked
              value:
                type: https://irp.bistec.example/problems/day-locked
                title: Day is locked
                status: 409
                detail: 2026-08-03 is Evaluated and locked for the student (FR-20).
                instance: /api/v1/entries
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    InternalServerError:
      description: An unexpected error. The trace id identifies the failing request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unhandled:
              summary: An unhandled error
              value:
                type: about:blank
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred.
                instance: /api/v1/example
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

    ServiceUnavailable:
      description: |
        A dependency required to authenticate the request could not be
        reached — for example, the JWKS endpoint used to verify the bearer
        token's signature. This is distinct from 401: the token itself may be
        perfectly valid, but it could not be checked. Retrying later is
        reasonable; retrying with a different token is not.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            jwksUnreachable:
              summary: The JWKS endpoint could not be reached
              value:
                type: https://irp.bistec.example/problems/service-unavailable
                title: Service temporarily unavailable
                status: 503
                detail: >-
                  Could not retrieve the signing keys needed to verify your
                  session. Please retry.
                instance: /api/v1/me
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
