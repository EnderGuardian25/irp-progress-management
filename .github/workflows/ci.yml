name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The deploy region is not Sri Lanka. Running under hostile zones
        # catches any reliance on server local time (NFR-12).
        timezone: ["UTC", "America/New_York", "Pacific/Kiritimati"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: irp
          POSTGRES_PASSWORD: irp
          POSTGRES_DB: irp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irp -d irp"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TZ: ${{ matrix.timezone }}
      DATABASE_URL: postgresql://irp:irp@localhost:5432/irp?schema=public
      # Deliberately unresolvable. No test reads this and no network call is
      # possible (test/helpers/build-test-server.ts hard-codes a local JWKS),
      # so a real Entra URL here would only imply CI depends on reaching
      # Microsoft. Plan 3 wires the tenant.
      JWKS_URI: https://jwks.invalid/keys
      JWT_ISSUER: https://issuer.test/v2.0
      JWT_AUDIENCE: api://irp-test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint the OpenAPI document
        run: pnpm spec:lint

      - name: Fail if regenerating changes anything
        run: |
          pnpm generate
          find packages/types/src packages/client/src -type f | sort | xargs sha256sum > /tmp/gen-before.txt
          pnpm generate
          find packages/types/src packages/client/src -type f | sort | xargs sha256sum > /tmp/gen-after.txt
          if ! diff -u /tmp/gen-before.txt /tmp/gen-after.txt; then
            echo "::error::Generation is not deterministic — the same spec produced different output."
            exit 1
          fi

      - name: Generate the Prisma client
        run: pnpm --filter @irp/api exec prisma generate

      - name: Fail if generated output is tracked in git
        run: |
          # Generated packages are git-ignored, so a clean regeneration leaves
          # the tree clean. `--porcelain` excludes ignored files, so this fires
          # only if someone force-committed generated output
          # (`git add -f packages/types/src/schema.ts`) or .gitignore regressed
          # — either of which creates a second, hand-editable copy of the
          # contract, exactly what the staleness gate above exists to prevent.
          #
          # This check is whole-repo and unfiltered, so it must run after every
          # generation step in the job — including `prisma generate` above —
          # or the class of output it produces last is never covered by this
          # gate. Generate first, porcelain-check once, for everything.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Regeneration dirtied the working tree — generated output is tracked, or .gitignore regressed."
            git status --porcelain
            exit 1
          fi

      - name: Build @irp/core
        run: pnpm --filter @irp/core build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Apply database migrations
        run: pnpm --filter @irp/api exec prisma migrate deploy

      - name: Test
        run: pnpm -r test
