name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    # A backstop, not a performance target. GitHub's default is 360 minutes, so
    # anything that hangs rather than fails burns six hours of runner per leg
    # and never reaches its cleanup steps. Task 9's review found one such hang
    # (`docker run` with no timeout) and bounded that single command; this is
    # the general case it named but did not close. Observed runtime is ~3.5
    # minutes, so this is roughly 5x headroom — it should only ever fire on a
    # genuine hang.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The deploy region is not Sri Lanka. Running under hostile zones
        # catches any reliance on server local time (NFR-12).
        timezone: ["UTC", "America/New_York", "Pacific/Kiritimati"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: irp
          POSTGRES_PASSWORD: irp
          POSTGRES_DB: irp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irp -d irp"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      TZ: ${{ matrix.timezone }}
      DATABASE_URL: postgresql://irp:irp@localhost:5432/irp?schema=public
      # Deliberately unresolvable. No test reads this and no network call is
      # possible (test/helpers/build-test-server.ts hard-codes a local JWKS),
      # so a real Entra URL here would only imply CI depends on reaching
      # Microsoft. Plan 3 wires the tenant.
      JWKS_URI: https://jwks.invalid/keys
      JWT_ISSUER: https://issuer.test/v2.0
      JWT_AUDIENCE: api://irp-test
      # apps/web. AUTH_DEV_BYPASS is deliberately absent — the unit suite must
      # not depend on it, and Task 5's guard test sets NODE_ENV itself.
      AUTH_SECRET: ci-only-secret-at-least-32-bytes-xx
      AUTH_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint the OpenAPI document
        run: pnpm spec:lint

      - name: Fail if regenerating changes anything
        run: |
          # Scoped to the CODE GENERATORS' output on purpose. packages/*/dist is
          # generated too but is deliberately NOT checksummed here: this gate
          # exists for the risk that @hey-api/openapi-ts emits different output
          # from the same spec (iteration-order-dependent templating). tsc
          # compiling already-checksummed src into .d.ts is a categorically more
          # reliable transform — no timestamps, no environment-dependent codegen,
          # compiler pinned by the lockfile — and covering it would mean running
          # both package builds twice, against the under-8-minute deploy target.
          # ADD packages/client/dist HERE IF tsconfig.build.json ever gains
          # declarationMap or anything else that can embed machine-specific paths.
          pnpm generate
          find packages/types/src packages/client/src -type f | sort | xargs sha256sum > /tmp/gen-before.txt
          pnpm generate
          find packages/types/src packages/client/src -type f | sort | xargs sha256sum > /tmp/gen-after.txt
          if ! diff -u /tmp/gen-before.txt /tmp/gen-after.txt; then
            echo "::error::Generation is not deterministic — the same spec produced different output."
            exit 1
          fi

      - name: Generate the Prisma client
        run: pnpm --filter @irp/api exec prisma generate

      - name: Build @irp/core
        run: pnpm --filter @irp/core build

      # Declaration-only emit. The runtime stays raw TypeScript for the bundler,
      # but consumers resolve TYPES from dist/*.d.ts. Without this, apps/web's
      # tsc pulls the generated runtime into its own program and re-checks it
      # under apps/web's stricter options — which would force a strictness
      # relaxation onto hand-written web code. Must run BEFORE Typecheck.
      # See packages/client/tsconfig.build.json.
      - name: Build @irp/client declarations
        run: pnpm --filter @irp/client build

      - name: Fail if generated output is tracked or dirties the tree
        run: |
          # Two distinct failure modes. `git status --porcelain` catches only
          # the second, though the step used to claim it caught both.
          #
          # (1) Force-committed generated output (`git add -f
          #     packages/types/src/schema.ts`). The determinism gate above
          #     guarantees regeneration is byte-identical, so a tracked copy
          #     regenerates to no diff and `git status --porcelain` comes back
          #     EMPTY — demonstrated: with schema.ts force-committed, the
          #     porcelain check exited 0 while the file was plainly tracked.
          #     `git ls-files` sees the path regardless of its content, so ask
          #     it directly.
          #
          # (2) A .gitignore regression, leaving generated files untracked and
          #     unignored. That does produce `??` lines and porcelain does fire
          #     — and `git ls-files` alone would miss it, because untracked is
          #     exactly what those files are. Both checks earn their place.
          #
          # Both are whole-repo and unfiltered, so they must run after every
          # generation step in the job — including `prisma generate` above — or
          # the class of output produced last is never covered. Generate first,
          # check once, for everything. That is also why this step now sits
          # after `Build @irp/core` and `Build @irp/client declarations`: those
          # two emit packages/core/dist and packages/client/dist, and a check
          # run before them would never see that output.
          if [ -n "$(git ls-files packages/types/src packages/client/src apps/api/src/generated packages/core/dist packages/client/dist)" ]; then
            echo "::error::Generated output is tracked in git — a second, hand-editable copy of the contract that can drift."
            git ls-files packages/types/src packages/client/src apps/api/src/generated packages/core/dist packages/client/dist
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Regeneration dirtied the working tree — .gitignore regressed, or a committed file changed."
            git status --porcelain
            exit 1
          fi

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # Plain tsc (Typecheck, above) does not run Next's own checks — it
      # missed both a typedRoutes error and a middleware export error that
      # broke the production build for four tasks. Only `next build` catches
      # those, so it runs as its own gate rather than being folded into
      # Typecheck. AUTH_DEV_BYPASS is unset at job level for this step on
      # purpose: with it set, `next build` sets NODE_ENV=production and
      # auth.config.ts's assertBypassNotInProduction correctly refuses to
      # build — see apps/web/auth.config.ts.
      - name: Build @irp/web
        run: pnpm --filter @irp/web build

      - name: Apply database migrations
        run: pnpm --filter @irp/api exec prisma migrate deploy

      - name: Test
        run: pnpm -r test

      # The four e2e steps below used to run on the UTC leg ONLY, when the e2e
      # spec was signin.spec.ts alone: it asserts sign-in identity and
      # rendering and contains no date or timezone assertion at all, so
      # running it three times bought no extra coverage while paying three
      # browser installs and three full app builds against the under-8-minute
      # deploy target (NFR-5).
      #
      # Plan 6 Task 16 added student-flows.spec.ts and mentor-flows.spec.ts,
      # and BOTH gain date-sensitive assertions -- the submission window's
      # size, the weekend persona's cycle-relative Extra badge, and the
      # seed's 14-day EVALUATED cutoff all read `new Date()` under
      # Asia/Colombo. That is exactly the condition the comment this replaced
      # named as the trigger to drop the UTC-only restriction, not work around
      # it -- so all three legs now run the full e2e suite.
      - name: Install the Playwright browser
        run: pnpm --filter @irp/web exec playwright install --with-deps chromium

      # Must run AFTER `pnpm -r test`, never before: apps/api's suites
      # TRUNCATE the User table, so a seed placed earlier is wiped by the time
      # this step runs. The unit suite itself must never depend on this seed
      # (Task 10) — that is why it is not seeded any earlier in the job.
      - name: Seed the demo data the e2e suite expects
        run: |
          pnpm --filter @irp/api db:seed

      # These overrides never actually reach either spawned webServer:
      # apps/web/playwright.config.ts sets JWKS_URI/JWT_ISSUER/JWT_AUDIENCE
      # unconditionally in the api webServer's own `env` block, and
      # AUTH_DEV_BYPASS unconditionally in the web webServer's — and
      # Playwright merges `{ ...process.env, ...webServer.env }`, so the
      # config-level value always wins. They are set here anyway, matching
      # playwright.config.ts's own choices exactly (JWKS_URI as 127.0.0.1
      # because it is fetched over the network; JWT_ISSUER as localhost
      # because it is only ever string-compared) so this step documents the
      # same contract rather than a stale or contradictory one, and so they
      # take effect immediately if that config ever changes to read from
      # process.env the way its DATABASE_URL and AUTH_SECRET already do.
      - name: End-to-end suite
        env:
          AUTH_DEV_BYPASS: "true"
          JWKS_URI: http://127.0.0.1:3000/api/dev-jwks
          JWT_ISSUER: http://localhost:3000/api/dev-jwks
          JWT_AUDIENCE: api://irp-progress-management
        run: pnpm --filter @irp/web e2e

      # playwright.config.ts's CI reporter is now `[["github"], ["html", {
      # open: "never" }]]`, not bare "github" — the github reporter alone
      # writes NO files (only inline PR annotations), so this step used to
      # upload an empty playwright-report/ and go green on an e2e failure
      # with zero diagnostics attached. test-results/ is uploaded too: that
      # is where `trace: "retain-on-failure"` writes, and traces are the
      # actually useful artifact for debugging a CI-only failure.
      #
      # Deliberately NOT setting if-no-files-found: error. This step's `if`
      # also fires when some OTHER step on this leg failed before Playwright
      # ever ran (e.g. Lint, or the DB migration step) — in that case both
      # directories legitimately don't exist, and hardening this into a hard
      # failure would turn an unrelated failure into a second, misleading
      # one. Leave the default (`warn`) so that scenario stays a warning, not
      # a red X.
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.timezone }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # The Entra path, proven against a real token. Dormant until the tenant
  # exists: set the repository VARIABLE ENTRA_REAL_TOKEN_TESTS to 'true'.
  #
  # Gated on a VARIABLE, not on secret presence, because variables are readable
  # when secrets are not. That is what lets this job tell "expected but absent"
  # (hard fail) from "not configured yet" (do not run) — the same reasoning as
  # apps/api/test/helpers/require-db.ts, with the flag explicit instead of
  # inferred. A conditionally-skipped job is the false-green shape this repo has
  # been bitten by twice.
  real-token:
    if: vars.ENTRA_REAL_TOKEN_TESTS == 'true'
    runs-on: ubuntu-latest
    # See the note on verify. This job talks to Entra over the network, which is
    # exactly the kind of call that hangs instead of failing.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: irp
          POSTGRES_PASSWORD: irp
          POSTGRES_DB: irp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irp -d irp"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://irp:irp@localhost:5432/irp?schema=public
    steps:
      - uses: actions/checkout@v4

      - name: Hard-fail if the secrets are expected but absent
        env:
          ENTRA_TENANT_ID: ${{ secrets.ENTRA_TENANT_ID }}
          ENTRA_K6_CLIENT_ID: ${{ secrets.ENTRA_K6_CLIENT_ID }}
          ENTRA_K6_CLIENT_SECRET: ${{ secrets.ENTRA_K6_CLIENT_SECRET }}
          ENTRA_API_AUDIENCE: ${{ secrets.ENTRA_API_AUDIENCE }}
        run: |
          missing=0
          for name in ENTRA_TENANT_ID ENTRA_K6_CLIENT_ID ENTRA_K6_CLIENT_SECRET ENTRA_API_AUDIENCE; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing, but ENTRA_REAL_TOKEN_TESTS=true says these tests are expected."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate
        run: |
          pnpm generate
          pnpm --filter @irp/api exec prisma generate
          pnpm --filter @irp/core build

      - name: Apply database migrations
        run: pnpm --filter @irp/api exec prisma migrate deploy

      - name: Acquire a real Entra token via the k6 service principal
        id: token
        env:
          TENANT: ${{ secrets.ENTRA_TENANT_ID }}
          CLIENT_ID: ${{ secrets.ENTRA_K6_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ENTRA_K6_CLIENT_SECRET }}
          AUDIENCE: ${{ secrets.ENTRA_API_AUDIENCE }}
        run: |
          # Client credentials, so no browser is involved. This service
          # principal is required by Deliverable 4 anyway (NFR-3), so this is
          # D4's prerequisite built early rather than extra scaffolding.
          resp=$(curl -sS -X POST \
            "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
            -d "client_id=${CLIENT_ID}" \
            -d "client_secret=${CLIENT_SECRET}" \
            -d "scope=${AUDIENCE}/.default" \
            -d "grant_type=client_credentials")
          token=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then
            echo "::error::Token acquisition failed: $(echo "$resp" | jq -c '.error_description // .')"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Register the service principal as a User, then call /api/v1/me
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.token }}
          TENANT: ${{ secrets.ENTRA_TENANT_ID }}
          AUDIENCE: ${{ secrets.ENTRA_API_AUDIENCE }}
          JWKS_URI: https://login.microsoftonline.com/${{ secrets.ENTRA_TENANT_ID }}/discovery/v2.0/keys
          JWT_ISSUER: https://login.microsoftonline.com/${{ secrets.ENTRA_TENANT_ID }}/v2.0
          JWT_AUDIENCE: ${{ secrets.ENTRA_API_AUDIENCE }}
        run: |
          # The oid of a client-credentials token is the service principal's
          # object id. A User row must exist for it, or the API correctly 403s.
          oid=$(echo "$ACCESS_TOKEN" | cut -d. -f2 \
            | tr '_-' '/+' | base64 -d 2>/dev/null | jq -r '.oid')
          if [ -z "$oid" ] || [ "$oid" = "null" ]; then
            echo "::error::Could not read the oid claim from the acquired token."
            exit 1
          fi
          # DATABASE_URL ends in `?schema=public`, a Prisma connection-string
          # param psql doesn't understand and rejects outright -- strip it
          # before handing the URL to psql. This job is dormant, so the bug
          # would have surfaced only on the day someone set
          # ENTRA_REAL_TOKEN_TESTS=true — fixed here at the same time as the one
          # that actually fired.
          PSQL_URL="${DATABASE_URL%%\?*}"
          psql "$PSQL_URL" -c "INSERT INTO \"User\" (\"id\", \"externalId\", \"email\", \"displayName\", \"role\", \"createdAt\", \"updatedAt\") VALUES (gen_random_uuid(), '${oid}', 'k6@ci.local', 'k6 Load Principal', 'ADMIN', now(), now()) ON CONFLICT (\"externalId\") DO NOTHING;"

          pnpm --filter @irp/api dev &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3001/health >/dev/null 2>&1 && break
            sleep 1
          done

          status=$(curl -sS -o /tmp/me.json -w '%{http_code}' \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            http://localhost:3001/api/v1/me)

          echo "GET /api/v1/me → $status"
          cat /tmp/me.json
          if [ "$status" != "200" ]; then
            echo "::error::A real Entra token did not authenticate against the API."
            exit 1
          fi

  # Image build and container startup. A SEPARATE job rather than a fourth leg
  # of verify's timezone matrix: nothing here is timezone-sensitive, and three
  # legs each building three images would triple the slowest job in the
  # workflow against NFR-5's under-8-minute budget.
  # A separate job, not a step in `verify`. `verify` is a three-timezone matrix
  # and nothing about Bicep compilation is timezone-sensitive, so folding it in
  # would triple the cost for zero extra coverage — against NFR-5's budget.
  #
  # This job needs NO Azure credentials. `az bicep lint` compiles and
  # type-checks locally; it never calls ARM. That is the whole reason the
  # template can be gated before a subscription is ready. `az deployment
  # what-if` and `validate` DO call ARM and are therefore runbook procedures,
  # not gates — see the Plan 4B design spec §10.
  infra:
    runs-on: ubuntu-latest
    # See the note on verify. Backstop only; observed runtime is well under a
    # minute.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # ubuntu-latest ships the Azure CLI, but not the Bicep CLI. Needs no
      # authentication.
      - name: Install the Bicep CLI
        run: az bicep install

      # NOT `az bicep lint` directly: it exits 0 on warnings, and BCP053 —
      # reading a property a resource type does not have — is a warning, so a
      # bare exit-code check would pass a broken template. The runner fails on
      # any Error or Warning diagnostic, and also fails if bicepconfig.json was
      # not loaded, since that silently reverts every rule to its default.
      - name: Lint and type-check the Bicep template
        run: node infra/lint.mjs infra/main.bicep

  images:
    runs-on: ubuntu-latest
    # See the note on verify. This job has the most unbounded waits of the
    # three: `timeout 60` covers the bypass-refusal run, and every healthcheck
    # in compose.yaml is bounded by retries x interval, but `docker compose up
    # --wait` still blocks indefinitely if the `migrate` service hangs — it has
    # no healthcheck and `api` gates on service_completed_successfully, so a
    # migration stuck on an advisory lock has nothing to time it out. Observed
    # runtime is ~5.5 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build all three targets. Without this the Dockerfile rots silently the
      # first time a dependency or a build script changes.
      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          load: true
          tags: irp-api:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          load: true
          tags: irp-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          load: true
          tags: irp-migrate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A containerised `next start` is a brand-new entry point for
      # assertBypassNotInProduction and had never been exercised against it
      # before Plan 4A. This is the only gate covering it. If the container
      # starts, guard one has broken and the dev bypass could reach a deployed
      # environment — that is an auth failure, not a test failure.
      #
      # A bare non-zero exit is NOT sufficient evidence the guard fired: a
      # missing env var, a bad CMD, or a corrupt layer would also make the
      # container exit non-zero, and the step would print "correct" while
      # proving nothing about the dev-bypass guard — the same false-pass class
      # gate 4 exists to rule out for the 401 assertion below, now applied
      # here too. The container's output is captured and asserted against the
      # guard's actual error string instead of trusting the exit code alone.
      # And if the guard fails open — it doesn't throw, `next start` serves —
      # `docker run` would otherwise block forever with no built-in timeout,
      # burning the runner for GitHub's 360-minute default and never reaching
      # "Dump container logs" / "Tear down". `timeout 60` bounds that, and
      # exit code 124 (timeout's own signal that the command was still
      # running) is treated as its own distinct, clearly-labelled failure.
      - name: The web container must refuse AUTH_DEV_BYPASS=true
        run: |
          set +e
          output=$(timeout 60 docker run --rm \
            -e AUTH_SECRET=ci-only-secret-at-least-32-bytes-xx \
            -e AUTH_URL=http://localhost:3000 \
            -e API_BASE_URL=http://localhost:3001 \
            -e AUTH_DEV_BYPASS=true \
            irp-web:ci 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -eq 124 ]; then
            echo "::error::The web container did not exit within 60s with AUTH_DEV_BYPASS=true — it is serving instead of refusing. Guard one is broken."
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "::error::The web container started with AUTH_DEV_BYPASS=true. Guard one is broken."
            exit 1
          fi
          if ! echo "$output" | grep -q "AUTH_DEV_BYPASS is set in a production build"; then
            echo "::error::The container exited non-zero (code $code) but not with the dev-bypass guard's error — it failed for an unrelated reason, and this gate is no longer testing what it claims."
            exit 1
          fi
          echo "Refused to start with the dev-bypass guard's error, exit code $code — correct."

      - name: Bring the whole stack up
        env:
          APP_VERSION: ${{ github.sha }}
        run: docker compose up --wait --build

      - name: The API is healthy and reports the build version
        run: |
          body=$(curl -fsS http://localhost:3001/health)
          echo "$body"
          echo "$body" | grep -q "${GITHUB_SHA:0:7}" || {
            echo "::error::/health did not report the build version. APP_VERSION did not reach the image."
            exit 1
          }

      # Fail-closed, in production mode, from a real container. The unit suite
      # cannot cover NODE_ENV=production behaviour of the problem-details
      # handler.
      - name: An unauthenticated /api/v1/me returns 401 with a Problem Details body
        run: |
          status=$(curl -sS -o /tmp/me.json -w '%{http_code}' http://localhost:3001/api/v1/me)
          echo "status=$status"
          cat /tmp/me.json
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 from an unauthenticated /api/v1/me, got $status."
            exit 1
          fi
          grep -q '"type"' /tmp/me.json || {
            echo "::error::The 401 body is not RFC 7807 Problem Details."
            exit 1
          }

      - name: The web app serves its sign-in page
        run: curl -fsS -o /dev/null http://localhost:3000/signin

      # ADR-0009 D5 scales to zero, so this is a routine event, not a
      # deploy-time one. A 137 here is a SIGKILL: dropped in-flight requests on
      # every scale-down, against NFR-2's zero-5xx target.
      - name: The API drains on SIGTERM rather than being killed
        run: |
          docker compose stop api
          code=$(docker compose ps -a --format '{{.Service}} {{.ExitCode}}' | awk '$1=="api"{print $2}')
          echo "api exit code: $code"
          if [ "$code" != "0" ]; then
            echo "::error::api exited $code on SIGTERM (137 = SIGKILL). The drain did not complete."
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
